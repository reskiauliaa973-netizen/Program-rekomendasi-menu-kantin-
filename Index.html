<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Menu Kantin - By Resky</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#dbeafe;min-height:100vh;padding:20px;display:flex;justify-content:center}
  .card{background:#fff;width:100%;max-width:520px;padding:28px 22px;border-radius:24px;border:3px solid #2563eb;box-shadow:0 15px 35px rgba(37,99,235,.25);height:fit-content}
  h1{color:#1e40af;text-align:center;font-size:26px}
  p.sub{text-align:center;color:#64748b;margin:8px 0 20px;font-size:14px}
  label{font-weight:700;color:#1e40af;display:block;margin-top:14px;margin-bottom:6px}
  input,select{width:100%;padding:13px;border:2px solid #bfdbfe;border-radius:12px;font-size:16px;outline:none;background:#eff6ff}
  input:focus,select:focus{border-color:#2563eb}
  .pref{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .pref button{padding:9px 16px;border-radius:999px;border:2px solid #bfdbfe;background:#eff6ff;color:#1e40af;font-weight:700;cursor:pointer;font-size:14px}
  .pref button.active{background:#2563eb;color:#fff;border-color:#2563eb}
  #btnCari{width:100%;margin-top:20px;padding:15px;border:none;border-radius:14px;background:#2563eb;color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #1e3a8a}
  #btnCari:active{transform:translateY(3px);box-shadow:0 2px 0 #1e3a8a}
  #hasil{margin-top:20px;display:none}
  .item{background:#eff6ff;border:2px solid #bfdbfe;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .item b{color:#1e40af;font-size:16px}
  .item span{font-size:13px;color:#64748b}
  .harga{background:#2563eb;color:#fff;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
  .cocok{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}
  #kosong{text-align:center;color:#94a3b8;padding:16px}
  .footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center;font-size:55px">🍔🍟🥤</div>
  <h1>Menu Kantin Apa Hari Ini?</h1>
  <p class="sub">Masukkan budget & maumu, biar kami pilihkan yang pas!</p>

  <label>💰 Budget Kamu (Rp)</label>
  <input type="number" id="budget" placeholder="Contoh: 10000" value="10000">

  <label>😋 Kamu Pengen Yang Gimana?</label>
  <div class="pref" id="prefArea">
    <button type="button" onclick="pilihPref(this,'semua')" class="active">Semua 🍽️</button>
    <button type="button" onclick="pilihPref(this,'kenyang')">Bikin Kenyang 🍚</button>
    <button type="button" onclick="pilihPref(this,'pedas')">Pedas 🌶️</button>
    <button type="button" onclick="pilihPref(this,'manis')">Manis 🍰</button>
    <button type="button" onclick="pilihPref(this,'sehat')">Sehat 🥗</button>
    <button type="button" onclick="pilihPref(this,'segar')">Segar 🥤</button>
  </div>

  <label>🍜 Kategori</label>
  <select id="kategori">
    <option value="semua">Semua Kategori</option>
    <option value="makanan">Makanan Berat</option>
    <option value="cemilan">Cemilan</option>
    <option value="minuman">Minuman</option>
  </select>

  <button id="btnCari" onclick="cariMenu()">🔍 CARI REKOMENDASI</button>

  <div id="hasil"></div>
  <div class="footer">Dibuat untuk Tugas Sekolah | Github Pages</div>
</div>

<script>
  // DATA MENU KANTIN - Bisa kamu ganti sesuai kantin sekolahmu
  const menus = [
    {nama:"Nasi Goreng Spesial", harga:10000, kategori:"makanan", pref:"kenyang", emoji:"🍛", desc:"Porsi besar, bikin kenyang"},
    {nama:"Mie Goreng Pedas", harga:8000, kategori:"makanan", pref:"pedas", emoji:"🍜", desc:"Pedas nampol, enak banget"},
    {nama:"Ayam Geprek + Nasi", harga:12000, kategori:"makanan", pref:"pedas", emoji:"🍗", desc:"Ayam crispy + sambal pedas"},
    {nama:"Nasi Kuning", harga:7000, kategori:"makanan", pref:"kenyang", emoji:"🍚", desc:"Murah, enak, kenyang"},
    {nama:"Bakso Kuah", harga:9000, kategori:"makanan", pref:"kenyang", emoji:"🍲", desc:"Kuah hangat, segar"},
    {nama:"Risol Mayo", harga:3000, kategori:"cemilan", pref:"manis", emoji:"🥐", desc:"Creamy, gurih manis"},
    {nama:"Donat Coklat", harga:5000, kategori:"cemilan", pref:"manis", emoji:"🍩", desc:"Manis, lembut"},
    {nama:"Pisang Goreng", harga:5000, kategori:"cemilan", pref:"manis", emoji:"🍌", desc:"Hangat, manis"},
    {nama:"Salad Buah", harga:8000, kategori:"cemilan", pref:"sehat", emoji:"🥗", desc:"Sehat, segar, rendah kalori"},
    {nama:"Es Teh Manis", harga:3000, kategori:"minuman", pref:"segar", emoji:"🧋", desc:"Segar, manis dingin"},
    {nama:"Es Jeruk", harga:5000, kategori:"minuman", pref:"segar", emoji:"🍊", desc:"Vitamin C, segar"},
    {nama:"Jus Alpukat", harga:10000, kategori:"minuman", pref:"sehat", emoji:"🥑", desc:"Sehat, creamy"},
  ];

  let prefDipilih = 'semua';

  function pilihPref(btn, nilai){
    prefDipilih = nilai;
    document.querySelectorAll('.pref button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }

  function cariMenu(){
    const budget = parseInt(document.getElementById('budget').value) || 0;
    const kategori = document.getElementById('kategori').value;
    const hasilDiv = document.getElementById('hasil');
    hasilDiv.style.display = 'block';

    // FILTER: Harga <= Budget + sesuai preferensi + kategori
    let hasil = menus.filter(m => {
      if(m.harga > budget) return false;
      if(prefDipilih !== 'semua' && m.pref !== prefDipilih) return false;
      if(kategori !== 'semua' && m.kategori !== kategori) return false;
      return true;
    });

    // Urutkan dari yang paling mahal tapi masih muat (biar puas)
    hasil.sort((a,b)=> b.harga - a.harga);

    if(hasil.length === 0){
      hasilDiv.innerHTML = `<div id="kosong">😢 Waduh, budget Rp ${budget.toLocaleString('id-ID')} belum cukup.<br>Coba naikkan budget atau pilih "Semua".</div>`;
      return;
    }

    let sisa = budget - hasil[0].harga;
    let html = `<b style="color:#1e40af">✅ Ketemu ${hasil.length} menu buat kamu! (Budget Rp ${budget.toLocaleString('id-ID')})</b><br><span style="font-size:13px;color:#64748b">Rekomendasi terbaik ada di paling atas</span><br><br>`;

    hasil.forEach((m,i)=>{
      html += `
        <div class="item">
          <div>
            <b>${m.emoji} ${m.nama}</b> ${i===0?'<span class="cocok">⭐ PALING COCOK</span>':''}<br>
            <span>${m.desc} • ${m.kategori}</span>
          </div>
          <div class="harga">Rp ${m.harga.toLocaleString('id-ID')}</div>
        </div>
      `;
    });

    html += `<div style="background:#dcfce7;padding:12px;border-radius:12px;text-align:center;color:#166534;font-weight:700;font-size:14px">💰 Sisa uangmu kalau pilih yang paling atas: Rp ${sisa.toLocaleString('id-ID')}</div>`;
    hasilDiv.innerHTML = html;
  }

  // Langsung tampilkan hasil saat pertama dibuka
  cariMenu();
</script>
</body>
</html>
